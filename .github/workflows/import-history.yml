name: import history
on:
  push:
    branches: [import-bootstrap]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Push original history
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL "https://responding-knights-incorporate-rip.trycloudflare.com/minecart.bundle" -o /tmp/repo.bundle
          git bundle verify /tmp/repo.bundle
          rm -rf /tmp/src
          git clone /tmp/repo.bundle /tmp/src
          cd /tmp/src
          git show-ref
          git remote add github https://github.com/JoshuaVucelich/minecart-speed.git
          hdr="AUTHORIZATION: bearer ${TOKEN}"
          git -c http.extraheader="$hdr" push github refs/remotes/origin/mc/26.1.2:refs/heads/mc/26.1.2
          git -c http.extraheader="$hdr" push github refs/remotes/origin/mc/26.3:refs/heads/mc/26.3
          set +e
          git -c http.extraheader="$hdr" push --force github refs/remotes/origin/main:refs/heads/main
          push_status=$?
          set -e
          echo "main_force_push_status ${push_status}"
          if [ "$push_status" != "0" ]; then
            code=$(curl -sS -o /tmp/ref.json -w "%{http_code}" -X PATCH \
              -H "Authorization: bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/JoshuaVucelich/minecart-speed/git/refs/heads/main \
              -d '{"sha":"a698077189bdd730147c0d86e3ce8839c2255d97","force":true}')
            echo "main_ref_update_status ${code}"
            head -c 500 /tmp/ref.json || true
            echo
            if [ "$code" != "200" ]; then
              exit 1
            fi
          fi
          git ls-remote https://github.com/JoshuaVucelich/minecart-speed.git
          main_sha=$(git ls-remote https://github.com/JoshuaVucelich/minecart-speed.git refs/heads/main | awk '{print $1}')
          old_sha=$(git ls-remote https://github.com/JoshuaVucelich/minecart-speed.git refs/heads/mc/26.1.2 | awk '{print $1}')
          new_sha=$(git ls-remote https://github.com/JoshuaVucelich/minecart-speed.git refs/heads/mc/26.3 | awk '{print $1}')
          test "$main_sha" = "a698077189bdd730147c0d86e3ce8839c2255d97"
          test "$new_sha" = "a698077189bdd730147c0d86e3ce8839c2255d97"
          test "$old_sha" = "f016349d7d93d728bc8b6a4f04e1349c120267a0"
          del=$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE \
            -H "Authorization: bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JoshuaVucelich/minecart-speed/git/refs/heads/import-bootstrap)
          echo "delete_bootstrap_status ${del}"
          head -c 300 /tmp/del.json || true
          echo
