license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="VWS Digital"
logoFile="assets/minecart-speed/icon.png"
description='''
Boosts minecart speed (default 120 blocks/sec) when a powered rail sits on top of a configurable trigger block (default: redstone block). Server-configurable.
'''

[[mixins]]
config="minecart-speed.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
